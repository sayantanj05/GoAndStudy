spring.application.name=goandstudybackend
server.port=8080

spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=goandstudydb

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

nvidia.nim.api.key=${NVIDIA_API_KEY}
nvidia.nim.base.url=https://integrate.api.nvidia.com/v1
nvidia.nim.embedding.model=nvidia/nv-embedqa-e5-v5
nvidia.nim.reranker.model=nvidia/nv-rerankqa-mistral-4b-v3
nvidia.nim.llm.model=meta/llama-3.1-8b-instruct
nvidia.nim.recommendation.model=meta/llama-3.1-8b-instruct
nvidia.nim.embedding.dimensions=1024
nvidia.nim.llm.max.tokens=1000

cors.allowed.origins=http://localhost:8080,http://localhost:3001,http://localhost:3003,http://localhost:3000,http://localhost:3004,http://localhost:3005,http://localhost:3006,https://goandstudyfrontend.vercel.app,http://152.59.163.57:3003

# Enforce server-side allowlisting (IP/CIDR). Add your Atlas allowed IP(s) here.
# Example: 152.59.163.21/32
app.ip.allowlist=152.59.163.21/32
app.ip.allowlist.enabled=false


realtime.server.url=http://localhost:3001
realtime.server.secret=GoAndStudyRealtimeSecret2026

logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.goandstudybackend=DEBUG

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-empty-json-arrays=true
