global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'goandstudy-ml-api'
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: '/recommend/v2/metrics'
    scrape_interval: 10s

  - job_name: 'goandstudy-java-backend'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s

